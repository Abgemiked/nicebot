services:
  nicebot:
    build: .
    image: nicebot:latest
    container_name: nicebot
    restart: unless-stopped
    environment:
      # SQLite-Leveldatenbank im Volume
      - DB_PATH=/app/data/level_system.db
      # Audit-Log-SQLite (vom Web-Tool gelesen, gleiches data-Volume) — explizit
      # gesetzt, damit der Pfad nicht von DB_PATH-Ableitung abhängt.
      - AUDIT_DB_PATH=/app/data/audit_log.db
      # DSGVO: Aufbewahrungsfrist (Tage) + ob Nachrichteninhalte gespeichert werden.
      - AUDIT_RETENTION_DAYS=60
      - AUDIT_STORE_CONTENT=1
      # config.json beschreibbar gemountet (/einstellungen speichert dorthin)
      - CONFIG_PATH=/app/config/config.json
    env_file:
      - .env
    # Gemessen (2026-11-24): ~23 MiB im Betrieb -> 256m laesst reichlich Spitzenreserve.
    mem_limit: 256m
    # Service-API (aiohttp, Port 8130) laeuft im Bot-Prozess: TCP-Connect = Prozess lebt.
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8130), 3).close()"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
      - npm-web
      # Website-Server (Gewinnspiel) erreicht nicebot:8130 /internal/members/... hier.
      - abgemiked_data

  # Web-Verwaltungstool (FastAPI + React-SPA). Kein Host-Port-Mapping:
  # NPM routet nicebot.abgemiked.de intern auf nicebot-admin:8140.
  nicebot-admin:
    build: ./admin
    image: nicebot-admin:latest
    container_name: nicebot-admin
    restart: unless-stopped
    env_file:
      - ./admin/.env
    # Gemessen (2026-11-24): ~13 MiB im Betrieb -> 128m mit Reserve.
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8140/api/health', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      # Einbettung unter abgemiked.de/nicebot: CSRF-Origin + SSO-Bridge-Ziel.
      - PUBLIC_ORIGIN=https://abgemiked.de
      - CENTRAL_AUTH_URL=http://central-auth-backend:4150
    volumes:
      # Bot-config.json (rw, für spätere Konfig-Verwaltung M2)
      - ./config:/app/bot_config
      # Level-/Audit-SQLite (für M3/M5)
      - ./data:/app/bot_data
      # Bot-.env (rw) — Secrets-Verwaltung durch Voll-Admin
      - ./.env:/app/bot_env/.env
    networks:
      - default
      - npm-web
      # Website-nginx erreicht nicebot-admin hier für den /nicebot-Proxy;
      # nicebot-admin erreicht central-auth-backend für die SSO-Bridge.
      - abgemiked_data

# Kein Host-Port-Mapping: der interne Service-Endpoint (service_api.py,
# Port 8130) ist nur aus den Docker-Netzen erreichbar — turnier-backend
# erreicht ihn ueber das gemeinsame npm-web-Netz als http://nicebot:8130.
# npm-web wird ausserdem fuer den Outbound-Call des /verknuepfen-Commands
# gebraucht (Bot → turnier-backend:3130).

networks:
  default:
    driver: bridge
  npm-web:
    external: true
    name: nginx-proxy-manager_web_net
  abgemiked_data:
    external: true
    name: abgemiked_data
